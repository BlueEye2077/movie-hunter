name: Android Fastlane with Firebase App Distribution Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  distribute_to_firebase:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout my repo code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - name: Use pre-installed Android NDK
      run: |
        NDK_VER=$(ls -1 "$ANDROID_HOME/ndk" 2>/dev/null | sort -V | tail -n 1)
        if [ -n "$NDK_VER" ]; then
          echo "Using pre-installed NDK: $NDK_VER"
          echo "ANDROID_NDK_VERSION=$NDK_VER" >> "$GITHUB_ENV"
        fi

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 'ruby'
        bundler-cache: true
        working-directory: android

    - name: Generate Envied config
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      run: |
        VAL="${TMDB_API_KEY#\"}"
        VAL="${VAL%\"}"
        VAL="$(printf '%s' "$VAL" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
        if [ -z "$VAL" ]; then
          echo "Error: TMDB_API_KEY secret is empty." >&2
          exit 1
        fi
        case "$VAL" in
          Bearer\ *) ;;
          *) VAL="Bearer $VAL" ;;
        esac
        printf 'TMDB_API_KEY="%s"\n' "$VAL" > .env
        flutter pub get
        dart run build_runner build --delete-conflicting-outputs
        rm -f .env
        
    - name: Build and Distribute App
      env:
        FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        BUILD_NUMBER: ${{ github.run_number }}
      run: |
        bundle exec fastlane android firebase_distribution
      working-directory: android

